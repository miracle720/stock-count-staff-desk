<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Count Staff Desk</title>
<style>
:root{--navy:#14243d;--blue:#285fbd;--bg:#f3f6fb;--ink:#1d2939;--muted:#66758b;--line:#e1e8f0;--green:#147a55;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:235px;background:var(--navy);color:#fff;padding:22px 14px;flex-shrink:0}.brand{font-weight:800;padding:5px 8px 25px}.brand small{display:block;color:#a9bbd4;font-size:10px;letter-spacing:1px;margin-top:3px}.nav button{display:block;width:100%;border:0;background:none;color:#c6d2e2;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0}.nav button.active,.nav button:hover{background:#28466f;color:#fff}.main{flex:1;min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px}.content{padding:26px;max-width:1350px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:3px 0 4px;font-size:25px}.muted,.desc{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:1px;color:var(--blue);font-weight:800}.btn{border:1px solid var(--line);background:#fff;color:#34445c;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:700}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:var(--red)}.actions,.tools{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 4px 16px #1d34500a}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px}.panel{margin-bottom:15px}.panel h3{margin:0 0 12px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:block;font-size:11px;font-weight:750;color:#526078;margin-bottom:5px}.fg.full{grid-column:1/-1}.field,select,textarea{width:100%;border:1px solid #d8e0eb;border-radius:8px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:85px;resize:vertical}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:#748197;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:10px;border-bottom:1px solid var(--line)}td{font-size:12px;padding:11px 10px;border-bottom:1px solid #edf0f5;vertical-align:middle}.badge{display:inline-block;padding:3px 8px;border-radius:20px;background:#e8f6ef;color:var(--green);font-size:10px;font-weight:750}.badge.warn{background:#fff4df;color:#96620e}.badge.red{background:#fff0ef;color:var(--red)}.notice{background:#edf4ff;color:#31558b;padding:11px 13px;border-radius:8px;font-size:12px;margin:12px 0}.notice.warn{background:#fff5e5;color:#80530c}.search{max-width:280px}.empty{text-align:center;padding:25px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#101c31aa;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{width:min(590px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:13px}.mhead,.mfoot{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.mhead h3{margin:0}.mbody{padding:18px}.mfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.close{border:0;background:none;font-size:22px}.toast{position:fixed;right:18px;bottom:18px;background:#14243d;color:white;padding:12px 16px;border-radius:8px;z-index:20;max-width:90vw}.hidden{display:none!important}.login{max-width:440px;margin:8vh auto;padding:28px}.login h1{margin:6px 0}.profile{font-size:12px;color:var(--muted)}.inline{display:flex;gap:8px;align-items:center}.inline .field{max-width:230px}
@media(max-width:800px){.side{width:190px}.content{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.shell{display:block}.side{width:100%;padding:12px}.brand{padding-bottom:10px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto;font-size:11px}.top{height:52px;padding:0 14px}.content{padding:15px}.head{display:block}.head .actions{margin-top:10px}.formgrid{grid-template-columns:1fr}.fg.full{grid-column:auto}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}}
</style></head><body><div id="app"></div><div class="modalback" id="back"><div class="modal"><div class="mhead"><h3 id="mtitle"></h3><button class="close" onclick="closeModal()">×</button></div><div class="mbody" id="mbody"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="msave">Save</button></div></div></div><div id="toast" class="toast hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
// 1. Paste your Firebase web app configuration below.
const firebaseConfig={apiKey:"AIzaSyB6arnU0CifZ66R0D3a-SHVCBG9HXN88Ko",authDomain:"stock-count-staff-desk.firebaseapp.com",projectId:"stock-count-staff-desk",appId:"1:258333409284:web:6624bec718bfda271af551"};
const configured=firebaseConfig.apiKey!=="YOUR_API_KEY"&&firebaseConfig.projectId!=="YOUR_PROJECT"&&firebaseConfig.appId!=="YOUR_APP_ID";
let auth=null,db=null,user=null,isAdmin=false,view='home',profile=null,roster=[],approvedList=[],studentProfiles=[],credentialEmails=[],bankAudit=[],attendance=[],scanners=[],issues=[],credentials=null,modalSave=null,unsubs=[];
const $=s=>document.querySelector(s),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},timeNow=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),fmtTime=v=>{const d=v?.toDate?v.toDate():v instanceof Date?v:null;return d&&!Number.isNaN(d.getTime())?d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'—'},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),csvRows=t=>{t=String(t||'').replace(/^\uFEFF/,'');let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);rows.push(row);row=[];v=''}else v+=c}if(v!==''||row.length){row.push(v);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))},key=s=>String(s||'').trim().toLowerCase();
if(configured){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();}
function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3600)}
function closeModal(){ $('#back').classList.remove('show');modalSave=null }
function modal(title,body,save){$('#mtitle').textContent=title;$('#mbody').innerHTML=body;modalSave=save;$('#back').classList.add('show');$('#msave').onclick=async()=>{try{await modalSave?.();closeModal()}catch(e){toast(e.message||'Could not save')}}}
function field(label,id,value='',type='text',extra=''){return `<div class="fg"><label>${label}</label><input class="field" id="f_${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function fileInput(label,id,accept='.csv,text/csv'){return `<div class="fg"><label>${label}</label><input class="field" id="f_${id}" type="file" accept="${accept}"></div>`}
function downloadCSV(name,headers,rows){const csv=[headers,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=name+'.csv';a.click();URL.revokeObjectURL(u)}
async function signIn(){if(!configured)return toast('Add your Firebase web configuration first.');try{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await auth.signInWithPopup(p)}catch(e){toast(e.message)}}
async function signOut(){await auth.signOut();}
async function boot(u){user=u;isAdmin=false;const adm=await db.collection('admins').doc(u.uid).get();isAdmin=adm.exists&&adm.data().enabled===true;if(!isAdmin){const email=key(u.email);if(!email)throw Error('Your Google account has no email address.');const allow=await db.collection('approvedStudents').doc(email).get();if(!allow.exists||allow.data().active===false)throw Error('This Google email has not been approved. Please contact the stock-count administrator.');const a=allow.data();const ref=db.collection('students').doc(u.uid);const snap=await ref.get();if(!snap.exists)await ref.set({uid:u.uid,email,name:a.name||u.displayName||email,bankName:'',accountName:'',accountNumber:'',createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}
await loadData();render();}
async function loadData(){unsubs.forEach(f=>f());unsubs=[];if(isAdmin){const mergeRoster=()=>{const byEmail=new Map(studentProfiles.map(x=>[key(x.email),x]));roster=approvedList.map(a=>({...a,...(byEmail.get(key(a.email))||{}),email:a.email,name:a.name||byEmail.get(key(a.email))?.name||a.email,passwordSet:credentialEmails.includes(key(a.email))}));if(view==='staff'||view==='home')render()};unsubs.push(db.collection('approvedStudents').onSnapshot(s=>{approvedList=s.docs.map(d=>({id:d.id,...d.data()}));mergeRoster()}));unsubs.push(db.collection('students').onSnapshot(s=>{studentProfiles=s.docs.map(d=>({uid:d.id,...d.data()}));mergeRoster()}));unsubs.push(db.collection('credentials').onSnapshot(s=>{credentialEmails=s.docs.map(d=>key(d.id));mergeRoster()}));unsubs.push(db.collection('bankAudit').orderBy('changedAt','desc').limit(300).onSnapshot(s=>{bankAudit=s.docs.map(d=>({id:d.id,...d.data()}));if(view==='staff')render()}));unsubs.push(db.collection('attendance').orderBy('date','desc').limit(1000).onSnapshot(s=>{attendance=s.docs.map(d=>({id:d.id,...d.data()}));if(view==='attendance'||view==='home')render()}));unsubs.push(db.collection('scanners').onSnapshot(s=>{scanners=s.docs.map(d=>({id:d.id,...d.data()}));if(view==='scanners'||view==='home')render()}));unsubs.push(db.collection('issues').orderBy('createdAt','desc').limit(500).onSnapshot(s=>{issues=s.docs.map(d=>({id:d.id,...d.data()}));if(view==='issues'||view==='home')render()}));}else{const p=await db.collection('students').doc(user.uid).get();profile={uid:user.uid,...p.data()};unsubs.push(db.collection('credentials').doc(key(user.email)).onSnapshot(c=>{credentials=c.exists?c.data():null;render()}));unsubs.push(db.collection('attendance').where('uid','==',user.uid).limit(30).onSnapshot(s=>{attendance=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date.localeCompare(a.date));render()}));unsubs.push(db.collection('scanners').onSnapshot(s=>{scanners=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(db.collection('issues').where('uid','==',user.uid).limit(50).onSnapshot(s=>{issues=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()}));}}
function loginUI(){return `<div class="panel login"><div class="eyebrow">WAREHOUSE OPERATIONS</div><h1>Stock Count Staff Desk</h1><p class="muted">Sign in with the Google account approved by the administrator.</p>${!configured?'<div class="notice warn">Firebase setup is required. Add your Firebase web app configuration in the HTML file before publishing.</div>':''}<button class="btn primary" style="width:100%;margin-top:10px" onclick="signIn()">Continue with Google</button><p class="muted" style="font-size:11px;margin-top:18px">External staff: use the exact email address submitted to the stock-count administrator.</p></div>`}
function shell(content){return `<div class="shell"><aside class="side"><div class="brand">▦ Stock Count Staff Desk<small>WAREHOUSE OPERATIONS</small></div><nav class="nav">${(isAdmin?[['home','Overview'],['staff','Students & bank details'],['attendance','Attendance'],['scanners','Scanner allocation'],['issues','Issues & feedback']]:[['portal','My dashboard']]).map(([v,l])=>`<button class="${view===v?'active':''}" onclick="go('${v}')">${l}</button>`).join('')}</nav></aside><main class="main"><header class="top"><b>${isAdmin?'Admin portal':'Student portal'}</b><span class="profile">${esc(user.email)} &nbsp; <button class="btn" onclick="signOut()">Sign out</button></span></header><div class="content">${content}</div></main></div>`}
function head(k,t,d,actions=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="desc">${d}</p></div><div class="actions">${actions}</div></div>`}
function stat(label,n){return `<div class="stat"><span>${label}</span><strong>${n}</strong></div>`}
function homePage(){const present=attendance.filter(a=>a.date===today()&&!a.checkOutAt).length,free=scanners.filter(s=>s.status==='Available').length,open=issues.filter(i=>i.status!=='Resolved').length;return head('ADMINISTRATION','Stock count overview','Monitor the workforce, daily attendance, scanners and support requests.')+`<div class="stats">${stat('Approved students',roster.length)}${stat('Currently checked in',present)}${stat('Available scanners',free)}${stat('Open issues',open)}</div><div class="grid2"><section class="panel"><h3>Quick actions</h3><div class="actions"><button class="btn primary" onclick="studentImport()">Upload student list</button><button class="btn" onclick="passwordImport()">Upload WMS passwords</button><button class="btn" onclick="go('attendance')">View attendance</button></div></section><section class="panel"><h3>Important</h3><p class="muted">WMS usernames are automatically the students' Google email addresses. Only upload their passwords here.</p></section></div>`}
function studentsPage(){return head('STUDENT REGISTER','Students & bank details','Manage approved Google accounts, WMS passwords and payment details.',`<button class="btn primary" onclick="studentImport()">Upload student CSV</button><button class="btn" onclick="passwordImport()">Upload WMS passwords</button><button class="btn" onclick="exportStudents()">Export register</button>`)+`<div class="panel"><div class="tools"><input class="field search" id="searchStudents" placeholder="Search name or email" oninput="filterTable('studentsTable',this.value)"></div><div class="tablewrap"><table id="studentsTable"><thead><tr><th>Name</th><th>Google email / WMS username</th><th>Bank</th><th>Account name</th><th>Account number</th><th>Bank last updated</th><th>WMS password</th></tr></thead><tbody>${roster.map(s=>`<tr><td>${esc(s.name||'—')}</td><td>${esc(s.email||'')}</td><td>${esc(s.bankName||'—')}</td><td>${esc(s.accountName||'—')}</td><td>${esc(s.accountNumber||'—')}</td><td>${s.updatedAt?.toDate?s.updatedAt.toDate().toLocaleString():'—'}</td><td>${s.email?'<span class="badge">'+(s.passwordSet?'Uploaded':'Not uploaded')+'</span>':'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No students have signed in yet. Upload the approved name and email list first.</td></tr>'}</tbody></table></div></div><div class="panel"><h3>Bank detail change log</h3><div class="tablewrap"><table><thead><tr><th>Student email</th><th>Changed</th><th>Previous bank details</th><th>New bank details</th></tr></thead><tbody>${bankAudit.map(a=>`<tr><td>${esc(a.email)}</td><td>${a.changedAt?.toDate?a.changedAt.toDate().toLocaleString():'—'}</td><td>${esc([a.old?.bankName,a.old?.accountName,a.old?.accountNumber].filter(Boolean).join(' · ')||'No previous details')}</td><td>${esc([a.new?.bankName,a.new?.accountName,a.new?.accountNumber].filter(Boolean).join(' · '))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No bank detail changes recorded.</td></tr>'}</tbody></table></div></div><div class="notice">The approved list controls access. Students can only view their own WMS password and update their own bank details. Bank changes are logged.</div>`}
function exportStudents(){downloadCSV('student-register',['Name','Email / WMS username','Bank name','Account name','Account number'],roster.map(s=>[s.name,s.email,s.bankName,s.accountName,s.accountNumber]))}
function filterTable(id,q){document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function attendancePage(){return head('TIME & ATTENDANCE','Attendance register','Review student check-in and check-out records.',`<button class="btn" onclick="exportAttendance()">Export CSV</button>`)+`<div class="panel"><div class="tools"><input class="field search" placeholder="Search name or email" oninput="filterTable('attTable',this.value)"><input class="field" style="max-width:170px" type="date" id="attDate" value="${today()}" onchange="filterDate()"></div><div class="tablewrap"><table id="attTable"><thead><tr><th>Student</th><th>Date</th><th>Check-in</th><th>Check-out</th><th>Status</th><th>Correction</th></tr></thead><tbody>${attendance.map(a=>`<tr data-date="${esc(a.date)}"><td>${esc(a.name||a.email||a.uid)}</td><td>${esc(a.date)}</td><td>${esc(fmtTime(a.checkInAt))}</td><td>${esc(fmtTime(a.checkOutAt))}</td><td><span class="badge ${a.checkOutAt?'':'warn'}">${a.checkOutAt?'Checked out':'On site'}</span></td><td><button class="btn" onclick="editAttendance('${esc(a.id)}')">Edit times</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No attendance records yet.</td></tr>'}</tbody></table></div></div>`}
function editAttendance(id){const a=attendance.find(x=>x.id===id);if(!a)return;modal('Correct attendance times',`<div class="formgrid">${field('Check-in time','cin',fmtTime(a.checkInAt)==='—'?'':fmtTime(a.checkInAt),'time')}${field('Check-out time','cout',fmtTime(a.checkOutAt)==='—'?'':fmtTime(a.checkOutAt),'time')}</div><p class="muted">Administrative correction. Changes are saved to the attendance record.</p>`,async()=>{const checkIn=$('#f_cin').value,checkOut=$('#f_cout').value;if(!checkIn)throw Error('Check-in time is required.');const toDate=t=>t?new Date(`${a.date}T${t}:00`):null;await db.collection('attendance').doc(id).update({checkInAt:toDate(checkIn),checkOutAt:toDate(checkOut)})})}
function filterDate(){const d=$('#attDate').value;document.querySelectorAll('#attTable tbody tr').forEach(r=>r.style.display=!d||r.dataset.date===d?'':'none')}
function exportAttendance(){downloadCSV('attendance-register',['Student','Email','Date','Check-in','Check-out'],attendance.map(a=>[a.name,a.email,a.date,fmtTime(a.checkInAt),fmtTime(a.checkOutAt)]))}
function scannersPage(){return head('DEVICE CONTROL','Scanner allocation','Register devices and track collection and return.',`<button class="btn primary" onclick="scannerEdit()">Add scanner</button><button class="btn" onclick="exportScanners()">Export CSV</button>`)+`<div class="panel"><div class="tablewrap"><table><thead><tr><th>Scanner ID</th><th>Serial number</th><th>Assigned to</th><th>Status</th><th>Action</th></tr></thead><tbody>${scanners.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.serial||'—')}</td><td>${esc(s.assignedEmail||'—')}</td><td>${esc(s.status)}</td><td><div class="actions"><button class="btn" onclick="scannerEdit('${esc(s.id)}')">Edit</button><button class="btn danger" onclick="deleteScanner('${esc(s.id)}')" ${s.assignedUid||s.status==='Allocated'?'disabled title="Return this scanner before deleting"':''}>Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No scanners registered.</td></tr>'}</tbody></table></div></div>`}
function exportScanners(){downloadCSV('scanner-register',['Scanner ID','Serial','Assigned email','Status'],scanners.map(s=>[s.id,s.serial,s.assignedEmail,s.status]))}
function scannerEdit(id=''){const s=scanners.find(x=>x.id===id)||{};modal(id?'Update scanner':'Register scanner',`<div class="formgrid">${field('Scanner ID','sid',s.id||'','text',id?'readonly':'')}${field('Serial number','serial',s.serial||'')}<div class="fg full"><label>Assign to student (optional)</label><select class="field" id="f_assigned"><option value="">Unassigned</option>${roster.map(x=>`<option value="${esc(x.uid||'')}" ${s.assignedUid===x.uid?'selected':''}>${esc(x.name)} — ${esc(x.email)}</option>`).join('')}</select></div><div class="fg"><label>Status when unassigned</label><select class="field" id="f_status">${['Available','Faulty','Under maintenance'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`,async()=>{const sid=$('#f_sid').value.trim();if(!sid)throw Error('Enter a scanner ID.');if(id&&sid!==id)throw Error('Scanner ID cannot be changed while editing.');const ref=db.collection('scanners').doc(id||sid);if(!id){const existing=await ref.get();if(existing.exists)throw Error('That Scanner ID already exists. Choose a unique ID.');}const assignedUid=$('#f_assigned').value,assigned=roster.find(x=>x.uid===assignedUid);await ref.set({serial:$('#f_serial').value.trim(),status:assigned?'Allocated':$('#f_status').value,assignedUid:assigned?.uid||'',assignedEmail:assigned?.email||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp(),...(assigned?{assignedAt:firebase.firestore.FieldValue.serverTimestamp()}:{} )},{merge:!!id});toast(id?'Scanner details updated.':'Scanner registered.')})}
async function deleteScanner(id){const s=scanners.find(x=>x.id===id);if(!s)return toast('Scanner record not found.');if(s.assignedUid||s.status==='Allocated')return toast('Return this scanner before deleting it.');if(!confirm(`Delete scanner ${id}? This cannot be undone.`))return;try{await db.collection('scanners').doc(id).delete();toast(`Scanner ${id} deleted.`)}catch(e){toast(e.message||'Could not delete scanner.')}}
function issuesPage(){return head('SUPPORT DESK','Issues & feedback','Review student-submitted issues, feedback and suggestions.',`<button class="btn" onclick="exportIssues()">Export CSV</button>`)+`<div class="panel"><div class="tablewrap"><table><thead><tr><th>Student</th><th>Date</th><th>Type</th><th>Subject</th><th>Details</th><th>Status</th><th>Action</th></tr></thead><tbody>${issues.map(i=>`<tr><td>${esc(i.name||i.email)}</td><td>${esc(i.date)}</td><td>${esc(i.type)}</td><td>${esc(i.subject)}</td><td>${esc(i.details)}</td><td>${esc(i.status)}</td><td><select class="field" style="min-width:125px" onchange="setIssueStatus('${esc(i.id)}',this.value)">${['Open','In progress','Resolved'].map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No issues or feedback submitted.</td></tr>'}</tbody></table></div></div>`}
function exportIssues(){downloadCSV('issues-feedback',['Student','Email','Date','Type','Subject','Details','Status'],issues.map(i=>[i.name,i.email,i.date,i.type,i.subject,i.details,i.status]))}
async function setIssueStatus(id,status){await db.collection('issues').doc(id).update({status});toast('Issue status updated.')}
function adminPage(){let c={home:homePage,staff:studentsPage,attendance:attendancePage,scanners:scannersPage,issues:issuesPage};return shell(c[view]())}
function studentPage(){const a=attendance.find(x=>x.date===today()),mine=scanners.find(s=>s.assignedUid===user.uid),available=scanners.filter(s=>s.status==='Available');return shell(head('STUDENT PORTAL','Welcome, '+esc(profile?.name||user.displayName||'Student'),'Your attendance, WMS access, bank details and scanner allocation.')+`<div class="grid2"><section class="panel"><h3>Attendance — ${today()}</h3><p>${a?.checkInAt?'Checked in at <b>'+esc(fmtTime(a.checkInAt))+'</b>':'You have not checked in today.'}</p>${a?.checkOutAt?'<span class="badge">Checked out at '+esc(fmtTime(a.checkOutAt))+'</span>':`<div class="actions"><button class="btn primary" ${a?.checkInAt?'disabled':''} onclick="attendanceAction('in')">Check in</button><button class="btn" ${!a?.checkInAt?'disabled':''} onclick="attendanceAction('out')">Check out</button></div>`}</section><section class="panel"><h3>WMS login</h3><p class="muted">Username</p><b>${esc(user.email)}</b><p class="muted" style="margin-top:12px">Password</p><div class="inline"><input class="field" id="wmsPass" type="password" readonly value="${esc(credentials?.password||'')}"><button class="btn" onclick="togglePassword()">Show</button><button class="btn" onclick="copyWms()">Copy</button></div>${credentials?.password?'':'<p class="muted">Your password has not been uploaded yet. Contact the administrator.</p>'}</section></div><div class="grid2"><section class="panel"><h3>Bank details</h3><p class="muted">Submit accurate payment details. Updates are recorded for audit.</p><div class="formgrid">${field('Bank name','bank',profile?.bankName||'')}${field('Account name','accname',profile?.accountName||'')}${field('10-digit account number','accnum',profile?.accountNumber||'','text','inputmode="numeric" maxlength="10"')}</div><button class="btn primary" style="margin-top:12px" onclick="saveBank()">Save bank details</button></section><section class="panel"><h3>Scanner allocation</h3>${mine?`<p>You currently have scanner <b>${esc(mine.id)}</b> assigned.</p><button class="btn primary" onclick="returnScanner('${esc(mine.id)}')">Return scanner</button>`:available.length?`<div class="fg"><label>Available scanner</label><select class="field" id="pickScanner">${available.map(s=>`<option value="${esc(s.id)}">${esc(s.id)} ${s.serial?'— '+esc(s.serial):''}</option>`).join('')}</select></div><button class="btn primary" style="margin-top:12px" onclick="takeScanner()">Collect scanner</button>`:'<p class="muted">No scanners are currently available.</p>'}</section></div><section class="panel"><h3>Issues & feedback</h3><div class="formgrid"><div class="fg"><label>Type</label><select class="field" id="issueType"><option>Issue</option><option>Feedback</option><option>Suggestion</option></select></div><div class="fg"><label>Subject</label><input class="field" id="issueSubject" maxlength="100"></div><div class="fg full"><label>Description</label><textarea class="field" id="issueDetails" maxlength="1000"></textarea></div></div><button class="btn primary" style="margin-top:10px" onclick="submitIssue()">Send to support desk</button></section>`)}
function studentShell(){return studentPage()}
async function attendanceAction(mode){const ref=db.collection('attendance').doc(user.uid+'_'+today()),snap=await ref.get();if(mode==='in'){if(snap.exists)throw toast('You have already checked in today.');await ref.set({uid:user.uid,email:user.email,name:profile.name||user.displayName||'',date:today(),checkInAt:firebase.firestore.FieldValue.serverTimestamp(),checkOutAt:null,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}else{if(!snap.exists)throw toast('Check in first.');if(snap.data().checkOutAt)throw toast('You have already checked out.');await ref.update({checkOutAt:firebase.firestore.FieldValue.serverTimestamp()});const s=scanners.find(x=>x.assignedUid===user.uid);if(s)await returnScanner(s.id,true)}toast(mode==='in'?'Check-in recorded.':'Check-out recorded.');}
async function saveBank(){const bankName=$('#f_bank').value.trim(),accountName=$('#f_accname').value.trim(),accountNumber=$('#f_accnum').value.replace(/\D/g,'');if(!bankName||!accountName||accountNumber.length!==10)throw toast('Enter bank name, account name and a valid 10-digit account number.');const old={bankName:profile.bankName||'',accountName:profile.accountName||'',accountNumber:profile.accountNumber||''},next={bankName,accountName,accountNumber};await db.collection('students').doc(user.uid).update({...next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('bankAudit').add({uid:user.uid,email:user.email,old,new:next,changedAt:firebase.firestore.FieldValue.serverTimestamp()});Object.assign(profile,next);toast('Bank details saved. Changes have been logged.');render()}
function togglePassword(){const e=$('#wmsPass');e.type=e.type==='password'?'text':'password'}function copyWms(){const s=credentials?.password||'';if(!s)return toast('No password has been uploaded yet.');navigator.clipboard.writeText(s).then(()=>toast('WMS password copied.')).catch(()=>toast('Copy failed; reveal and copy it manually.'))}
async function takeScanner(){const id=$('#pickScanner').value;if(!id)return;const ref=db.collection('scanners').doc(id);await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists||s.data().status!=='Available'||s.data().assignedUid)throw Error('That scanner is no longer available.');tx.update(ref,{status:'Allocated',assignedUid:user.uid,assignedEmail:user.email,assignedAt:firebase.firestore.FieldValue.serverTimestamp()})});toast('Scanner allocated to you.')}
async function returnScanner(id,quiet=false){const ref=db.collection('scanners').doc(id);await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists||s.data().assignedUid!==user.uid)throw Error('This scanner is not assigned to you.');tx.update(ref,{status:'Available',assignedUid:'',assignedEmail:'',returnedAt:firebase.firestore.FieldValue.serverTimestamp()})});if(!quiet)toast('Scanner returned.')}
async function submitIssue(){const subject=$('#issueSubject').value.trim(),details=$('#issueDetails').value.trim();if(!subject||!details)throw toast('Enter a subject and description.');await db.collection('issues').add({uid:user.uid,email:user.email,name:profile.name||user.displayName||'',date:today(),type:$('#issueType').value,subject,details,status:'Open',createdAt:firebase.firestore.FieldValue.serverTimestamp()});$('#issueSubject').value='';$('#issueDetails').value='';toast('Issue or feedback submitted.')}
async function studentImport(){modal('Upload approved students CSV',`<p class="muted">CSV columns: <b>Name, Email</b>. Existing email records are updated. Students must sign in with this exact Google email.</p>${fileInput('CSV file','csv')}`,async()=>{const f=$('#f_csv').files[0];if(!f)throw Error('Choose a CSV file.');const rows=csvRows(await f.text());if(rows.length<2)throw Error('CSV must include a header and at least one student.');const h=rows[0].map(key),ni=h.indexOf('name'),ei=h.indexOf('email');if(ni<0||ei<0)throw Error('Required headers: Name, Email.');const batch=db.batch();let n=0;for(const r of rows.slice(1)){const email=key(r[ei]),name=String(r[ni]||'').trim();if(!email||!email.includes('@')||!name)continue;batch.set(db.collection('approvedStudents').doc(email),{name,email,active:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});n++}if(!n)throw Error('No valid student rows found.');await batch.commit();toast(n+' approved student records uploaded.')})}
async function passwordImport(){modal('Upload WMS passwords CSV',`<p class="muted">CSV columns: <b>Email, Password</b>. The WMS username is automatically the email address. Only passwords are imported.</p>${fileInput('CSV file','csv')}`,async()=>{const f=$('#f_csv').files[0];if(!f)throw Error('Choose a CSV file.');const rows=csvRows(await f.text());if(rows.length<2)throw Error('CSV must include headers and at least one password.');const h=rows[0].map(key),ei=h.indexOf('email'),pi=h.indexOf('password');if(ei<0||pi<0)throw Error('Required headers: Email, Password.');const batch=db.batch();let n=0;for(const r of rows.slice(1)){const email=key(r[ei]),password=String(r[pi]||'');if(!email||!email.includes('@')||!password)continue;batch.set(db.collection('credentials').doc(email),{password,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});n++}if(!n)throw Error('No valid email/password rows found.');await batch.commit();toast(n+' WMS passwords uploaded.')})}
function go(v){view=v;render()}function render(){if(!user){$('#app').innerHTML=loginUI();return}if(isAdmin)$('#app').innerHTML=adminPage();else $('#app').innerHTML=studentShell();}
auth?.onAuthStateChanged(async u=>{if(!u){user=null;unsubs.forEach(f=>f());render();return}try{await boot(u)}catch(e){toast(e.message);await auth.signOut()}});
if(!configured)render();
</script></body></html>
